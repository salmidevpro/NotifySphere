<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login - NotifySphere</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #e7f7f4 0%, #d9f1ec 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #0f3d35;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        padding: 32px;
        border: 1px solid rgba(0, 121, 97, 0.08);
      }
      h1 {
        margin-bottom: 18px;
        font-size: 30px;
        color: #004d40;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      label {
        display: block;
        margin-bottom: 10px;
        color: #1f4e45;
        font-weight: 700;
      }
      input {
        width: 100%;
        padding: 14px 16px;
        margin-top: 8px;
        border: 1px solid #c8e3dd;
        border-radius: 12px;
        font-size: 15px;
        background: #f7fdfb;
      }
      input:focus {
        outline: none;
        border-color: #26a69a;
        box-shadow: 0 0 0 4px rgba(38, 166, 154, 0.14);
        background: #ffffff;
      }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 14px 16px;
        background: #00796b;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
        transition: transform 0.2s ease, background 0.2s ease;
      }
      button:hover {
        transform: translateY(-2px);
        background: #00695c;
      }
      .hint {
        margin-top: 16px;
        font-size: 14px;
        color: #23554e;
        text-align: center;
      }
      .hint a {
        color: #00796b;
        text-decoration: none;
        font-weight: 700;
      }
      .hint a:hover {
        text-decoration: underline;
      }
      .error {
        margin-bottom: 14px;
        color: #922b21;
        background: #fdecea;
        border: 1px solid #f5c6cb;
        border-radius: 10px;
        padding: 12px 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><i class="fas fa-user-shield"></i> Admin Login</h1>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post">
        <label
          >Admin Username
          <input style="width: 90%;" name="username" autocomplete="username" required />
        </label>
        <label
          >Password
          <input style="width: 90%;"
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">Login as Admin</button>
      </form>
      <p class="hint">
        Not an admin? <a href="/login">Use the regular login</a>
      </p>
    </div>
  </body>
</html>
